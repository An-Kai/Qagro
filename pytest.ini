[pytest]
testpaths = tests
# Без addopts -m: фильтрацию live делает хук
# tests/conftest.py::pytest_collection_modifyitems (иначе --run-live
# не смог бы вернуть live-тесты — ini-фильтр их всегда выкидывал бы).
markers =
    unit: offline, mocked network, no writes to tracked repo files
    live: real network (Open-Meteo/TiTiler/AgroData), opt-in via --run-live
