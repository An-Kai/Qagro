# Qagro Streamlit theme — светлая тема по DESIGN.md (источник правды).
# Без этого Streamlit под тёмной ОС красит табы/кнопки/алерты в тёмное,
# и правило ink #111 из app/streamlit_app.py даёт нечитаемый тёмное-на-тёмном.
[theme]
base = "light"
primaryColor = "#1B7A3D"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F5F1"
textColor = "#111111"
font = "sans serif"
